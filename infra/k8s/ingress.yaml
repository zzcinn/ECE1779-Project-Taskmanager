apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanager-ingress
  namespace: taskmanager
  annotations:
    # DigitalOcean Load Balancer annotations
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Optional: for SSL/TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Socket.IO specific annotations for WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "taskmanager-api-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
spec:
  rules:
  - host: taskmanager.yourdomain.com  # REPLACE with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: taskmanager-api-service
            port:
              number: 3000
  # Uncomment below for TLS/SSL support
  # tls:
  # - hosts:
  #   - taskmanager.yourdomain.com
  #   secretName: taskmanager-tls

