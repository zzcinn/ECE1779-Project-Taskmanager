apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanager-api
  namespace: taskmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskmanager-api
  template:
    metadata:
      labels:
        app: taskmanager-api
    spec:
      containers:
      - name: api
        # You'll need to build and push your image to a container registry
        # For DigitalOcean, you can use their Container Registry
        # Example: registry.digitalocean.com/your-registry/taskmanager-api:latest
        image: registry.digitalocean.com/taskmanager-registry/taskmanager-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: taskmanager-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: taskmanager-config
              key: PORT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: taskmanager-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: taskmanager-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: taskmanager-secrets
              key: postgres-db
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: taskmanager-secrets
              key: postgres-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: taskmanager-secrets
              key: postgres-password
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: taskmanager-secrets
              key: session-secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: taskmanager-secrets
              key: jwt-secret
        livenessProbe:
          httpGet:
            path: /check
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /check
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      # Add init container to wait for database
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;']

