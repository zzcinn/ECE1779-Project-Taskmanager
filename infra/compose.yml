services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U taskapp -d taskdb || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../api
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: change_me_later
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: taskdb
      DB_USER: taskapp
      DB_PASSWORD: taskpass
      SESSION_SECRET: change_me_later
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pg_data: