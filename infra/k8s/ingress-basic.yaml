# Basic Ingress without SSL (for testing/development)
# Use this if you don't have a domain or don't need SSL yet
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmanager-ingress-basic
  namespace: taskmanager
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Socket.IO WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "taskmanager-api-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: taskmanager-api-service
            port:
              number: 3000

